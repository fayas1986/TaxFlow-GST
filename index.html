    <style>
      body {
        font-family: 'Plus Jakarta Sans', 'Inter', sans-serif;
        background-color: #F8FAFC;
        color: #0F172A;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
        font-feature-settings: "cv02", "cv03", "cv04", "cv11";
      }
      
      /* Corporate Table Styling */
      .table-corporate th {
        background-color: #F1F5F9;
        color: #334155;
        font-weight: 700;
        text-transform: uppercase;
        font-size: 0.725rem;
        letter-spacing: 0.05em;
        padding: 0.75rem 1rem;
        border-bottom: 1px solid #E2E8F0;
      }
      .table-corporate td {
        padding: 0.875rem 1rem;
        border-bottom: 1px solid #F1F5F9;
        font-size: 0.875rem;
      }
      .table-corporate tr:hover td {
        background-color: #F8FAFC;
      }

      /* Custom Scrollbar - Always Visible & Highly Responsive */
      .custom-scrollbar {
        scrollbar-width: thin;
        scrollbar-color: #94a3b8 #f1f5f9;
      }
      .custom-scrollbar::-webkit-scrollbar {
        width: 6px;
        height: 6px;
        display: block !important;
      }
      .custom-scrollbar::-webkit-scrollbar-track {
        background: #f1f5f9; 
        border-radius: 4px;
      }
      .custom-scrollbar::-webkit-scrollbar-thumb {
        background: #cbd5e1; 
        border-radius: 4px;
      }
      .custom-scrollbar::-webkit-scrollbar-thumb:hover {
        background: #94a3b8; 
      }

      /* Prominent Always-Visible Scrollbar */
      .custom-scrollbar-visible {
        overflow-x: auto !important;
        scrollbar-width: auto !important;
        scrollbar-color: #64748b #e2e8f0 !important;
      }
      .custom-scrollbar-visible::-webkit-scrollbar {
        height: 8px !important;
        width: 8px !important;
        display: block !important;
      }
      .custom-scrollbar-visible::-webkit-scrollbar-track {
        background: #f1f5f9 !important;
        border-radius: 4px !important;
        border: 1px solid #cbd5e1 !important;
      }
      .custom-scrollbar-visible::-webkit-scrollbar-thumb {
        background: #94a3b8 !important;
        border-radius: 4px !important;
      }
      .custom-scrollbar-visible::-webkit-scrollbar-thumb:hover {
        background: #64748b !important;
      }

      /* Corporate Background Grid */
      .bg-grid-pattern {
        background-image: radial-gradient(#cbd5e1 0.75px, transparent 0.75px);
        background-size: 16px 16px;
      }

      /* Print Optimizations */
      @media print {
        .no-print,
        nav,
        aside,
        .sidebar,
        header:not(.print-header),
        footer:not(.print-footer),
        .action-bar,
        .button-group,
        button:not(.print-only),
        .filter-section,
        .tab-navigation,
        .breadcrumb-container {
          display: none !important;
        }

        body {
          background: #ffffff !important;
          color: #0f172a !important;
          margin: 0 !important;
          padding: 0 !important;
          -webkit-print-color-adjust: exact !important;
          print-color-adjust: exact !important;
        }

        #root {
          width: 100% !important;
          margin: 0 !important;
          padding: 0 !important;
        }

        .print-container,
        #printable-invoices-register,
        #printable-invoice-document {
          display: block !important;
          width: 100% !important;
          max-width: 100% !important;
          margin: 0 !important;
          padding: 0 !important;
          box-shadow: none !important;
          border: none !important;
        }

        .card, .bg-white {
          box-shadow: none !important;
        }

        table {
          width: 100% !important;
          border-collapse: collapse !important;
        }
        th, td {
          border: 1px solid #cbd5e1 !important;
        }
      }
    </style>
